# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lumenora-nvidia-open
description: Lumenora KDE Plasma gaming distro with the NVIDIA driver (akmods, open kernel flavor, Turing and newer)
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: "44"

modules:
  - type: akmods
    nvidia-driver: nvidia-open
    install: []

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/kylegospo/bazaar/repo/fedora-44/kylegospo-bazaar-fedora-44.repo
      - https://copr.fedorainfracloud.org/coprs/chronoscrat/oh-my-posh/repo/fedora-44/chronoscrat-oh-my-posh-fedora-44.repo
    install:
      - curl
      - tar
      - fastfetch
      - pciutils
      - bazaar-store
      - distrobox
      - mangohud
      - gamemode
      - gamescope
      - oh-my-posh
      - eza

  - type: default-flatpaks
    notify: true
    system:
      install:
        - org.freedesktop.Platform.VulkanLayer.MangoHud
        - com.valvesoftware.Steam
        - net.lutris.Lutris
        - com.heroicgameslauncher.hgl
        - com.usebottles.bottles
        - com.obsproject.Studio

  - type: files
    files:
      - etc: /etc
      - usr: /usr

  - type: systemd
    system:
      enabled:
        - lumenora-gpu-detect.service

  - type: script
    scripts:
      - rebrand.sh