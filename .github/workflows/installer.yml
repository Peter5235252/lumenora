name: Build Lumenora Installer ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      payload_ref:
        description: Lumenora image to install
        required: false
        default: ghcr.io/peter5235252/lumenora:ffa598b-44
      release_tag:
        description: Existing GitHub release to attach the ISO to (optional)
        required: false

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull Lumenora payload
        env:
          PAYLOAD_REF: ${{ inputs.payload_ref || 'ghcr.io/peter5235252/lumenora:ffa598b-44' }}
        run: sudo podman pull "$PAYLOAD_REF"

      - name: Build installer environment
        run: sudo podman build -f installer/Containerfile -t localhost/lumenora-installer:latest installer

      - name: Build graphical installer ISO
        env:
          PAYLOAD_REF: ${{ inputs.payload_ref || 'ghcr.io/peter5235252/lumenora:ffa598b-44' }}
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            --workdir /output \
            -v "${{ github.workspace }}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
            --bootc-ref localhost/lumenora-installer:latest \
            --bootc-installer-payload-ref "$PAYLOAD_REF" \
            --bootc-default-fs ext4 \
            bootc-generic-iso

      - name: Create ISO checksum
        run: |
          iso="$(find output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          find output -type f -name '*.iso' -print0 | xargs -0 sha256sum > output/SHA256SUMS

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: lumenora-installer-iso
          path: |
            output/**/*.iso
            output/SHA256SUMS
          if-no-files-found: error

      - name: Attach installer ISO to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            output/**/*.iso
            output/SHA256SUMS
          fail_on_unmatched_files: true
