# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lumenora-nvidia
description: Lumenora KDE Plasma gaming distro with the NVIDIA driver (akmods, proprietary flavor)
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: "44"

modules:
  - type: script
    scripts:
      - update-os.sh

  - type: script
    scripts:
      - swap-ogc-kernel.sh
      - lumen-theme.sh

  - type: akmods
    base: ogc
    nvidia-driver: nvidia
    install: []

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/kylegospo/bazaar/repo/fedora-44/kylegospo-bazaar-fedora-44.repo
      - https://copr.fedorainfracloud.org/coprs/chronoscrat/oh-my-posh/repo/fedora-44/chronoscrat-oh-my-posh-fedora-44.repo
    install:
      - curl
      - tar
      - fastfetch
      - pciutils
      - bazaar-store
      - distrobox
      - mangohud
      - gamemode
      - gamescope
      - oh-my-posh
      - eza

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - org.freedesktop.Platform.VulkanLayer.MangoHud
          - com.valvesoftware.Steam
          - net.lutris.Lutris
          - com.heroicgameslauncher.hgl
          - com.usebottles.bottles
          - com.obsproject.Studio

  - type: files
    files:
      - etc: /etc
      - usr: /usr

  - type: systemd
    system:
      enabled:
        - lumenora-gpu-detect.service

  - type: script
    scripts:
      - rebrand.sh