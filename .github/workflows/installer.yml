name: Build Lumenora Installer ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      payload_ref:
        description: Lumenora image to install
        required: false
        default: ''
      release_tag:
        description: Existing GitHub release to attach the ISO to (optional)
        required: false

jobs:
  build-installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve and pull immutable Lumenora payload
        env:
          INPUT_PAYLOAD_REF: ${{ inputs.payload_ref }}
        run: |
          if [ -n "$INPUT_PAYLOAD_REF" ]; then
            payload_ref="$INPUT_PAYLOAD_REF"
          else
            payload_ref="ghcr.io/peter5235252/lumenora:${GITHUB_SHA::7}-44"
          fi
          case "$payload_ref" in
            ghcr.io/peter5235252/lumenora:*|ghcr.io/peter5235252/lumenora@*) ;;
            *) echo "payload_ref must target the public Lumenora package on GHCR" >&2; exit 1 ;;
          esac
          sudo podman pull "$payload_ref"
          payload_digest="$(sudo podman image inspect --format '{{index .RepoDigests 0}}' "$payload_ref")"
          test -n "$payload_digest"
          echo "PAYLOAD_REF=$payload_digest" >> "$GITHUB_ENV"
          echo "PAYLOAD_DIGEST=$payload_digest" >> "$GITHUB_ENV"
          sed -i "s|__LUMENORA_PAYLOAD_REF__|$payload_digest|g" installer/interactive-defaults.ks

      - name: Record image-builder version
        run: |
          sudo podman pull ghcr.io/osbuild/image-builder-cli:latest
          builder_digest="$(sudo podman image inspect --format '{{index .RepoDigests 0}}' ghcr.io/osbuild/image-builder-cli:latest)"
          test -n "$builder_digest"
          mkdir -p output
          {
            echo "payload=$PAYLOAD_REF"
            echo "payload_digest=$PAYLOAD_DIGEST"
            echo "image_builder=$builder_digest"
            echo "source_commit=$GITHUB_SHA"
          } > output/LUMENORA-BUILD-METADATA

      - name: Build installer environment
        run: sudo podman build -f installer/Containerfile -t localhost/lumenora-installer:latest installer

      - name: Build graphical installer ISO
        env:
          PAYLOAD_REF: ${{ env.PAYLOAD_REF }}
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            --security-opt label=type:unconfined_t \
            --workdir /output \
            -v "${{ github.workspace }}/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            ghcr.io/osbuild/image-builder-cli:latest \
            build \
            --bootc-ref localhost/lumenora-installer:latest \
            --bootc-installer-payload-ref "$PAYLOAD_REF" \
            --bootc-default-fs ext4 \
            bootc-generic-iso

      - name: Create ISO checksum
        run: |
          iso="$(find output -type f -name '*.iso' -print -quit)"
          test -n "$iso"
          find output -type f -name '*.iso' -print0 | xargs -0 sha256sum > output/SHA256SUMS

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: lumenora-installer-iso
          path: |
            output/**/*.iso
            output/SHA256SUMS
            output/LUMENORA-BUILD-METADATA
          if-no-files-found: error

      - name: Attach installer ISO to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            output/**/*.iso
            output/SHA256SUMS
          fail_on_unmatched_files: true
