name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Ruby for YAML validation
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Validate repository files
        run: bash scripts/validate.sh
