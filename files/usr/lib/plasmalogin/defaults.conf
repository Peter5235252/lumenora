# Lumenora — system fallback defaults for the Plasma Login Manager greeter.
# Replaces the Fedora-shipped file, whose Image points at the removed
# /usr/share/wallpapers/Fedora/ package. PLM loads source files in this order
# (highest priority first): /etc/plasmalogin.conf, /etc/plasmalogin.conf.d/*,
# /usr/lib/plasmalogin/defaults.conf, /usr/lib/plasmalogin/plasmalogin.conf.d/*.
# Keeping the Image here ensures the Lumen nebula is used even when the
# /etc/plasmalogin.conf.d drop-in is overridden by user config.

[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Lumen/contents/images/nebula-blurred.jpg
PreviewImage=file:///usr/share/wallpapers/Lumen/contents/images/nebula-blurred.jpg