# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: lumenora-nvidia-open
description: Lumenora KDE Plasma gaming distro with the NVIDIA driver (akmods, open kernel flavor, Turing and newer)
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: "44"

modules:
  - type: script
    scripts:
      - update-os.sh

  - type: script
    scripts:
      - swap-ogc-kernel.sh
      - dedup-home-subvol.sh
      - fish-default.sh
      - lumen-theme.sh

  - type: akmods
    base: ogc
    nvidia-driver: nvidia-open
    install: []

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/kylegospo/bazaar/repo/fedora-44/kylegospo-bazaar-fedora-44.repo
      - https://copr.fedorainfracloud.org/coprs/chronoscrat/oh-my-posh/repo/fedora-44/chronoscrat-oh-my-posh-fedora-44.repo
    install:
      - curl
      - tar
      - fastfetch
      - pciutils
      - bazaar-store
      - distrobox
      - mangohud
      - gamemode
      - gamescope
      - oh-my-posh
      - eza
      - fish
    remove:
      - plasma-discover
      - plasma-discover-libs
      - plasma-discover-flatpak
      - plasma-discover-kns
      - plasma-discover-notifier
      - plasma-discover-rpm-ostree
      - kwrite
      - kde-connect
      - kdeconnectd
      - kfind
      - kcharselect
      - khelpcenter

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: true
        install:
          - com.valvesoftware.Steam
          - net.lutris.Lutris
          - com.heroicgameslauncher.hgl
          - com.usebottles.bottles
          - com.obsproject.Studio
          - org.libretro.RetroArch
          - net.pcsx2.PCSX2
          - org.DolphinEmu.dolphin-emu
          - org.duckstation.DuckStation
          - com.vysp3r.ProtonPlus

  - type: files
    files:
      - etc: /etc
      - usr: /usr

  - type: systemd
    system:
      enabled:
        - lumenora-gpu-detect.service

  - type: script
    scripts:
      - rebrand.sh