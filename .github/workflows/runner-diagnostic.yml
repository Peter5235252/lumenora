name: Runner Diagnostic

on:
  workflow_dispatch:

jobs:
  runner-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm hosted runner
        run: |
          echo "GitHub hosted runner started successfully."
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Image: $ImageOS"
          uname -a
