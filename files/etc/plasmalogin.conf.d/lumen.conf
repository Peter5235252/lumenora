# Lumenora — Plasma Login Manager (PLM) greeter branding.
# Forces the Lumen (cosmic Nebula) wallpaper plugin on the login screen and
# keeps the text light (BreezeLight/Lumen rebuilt palette does the colors).
#
# PLM loads config from /etc/plasmalogin.conf, then the /etc/plasmalogin.conf.d
# drop-ins, then /usr/lib/plasmalogin/defaults.conf. Fedora's default Image
# points at /usr/share/wallpapers/Fedora/ which Lumenora removes, so the image
# path must be set here explicitly (also see the KDE `conf.d` loading change).
# Wallpaper plugin settings are namespaced under [Greeter][Wallpaper][<plugin>].
# See https://wiki.archlinux.org/title/Plasma_Login_Manager

[Greeter]
WallpaperPluginId=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Lumen/contents/images/nebula.jpg
PreviewImage=file:///usr/share/wallpapers/Lumen/contents/images/nebula.jpg