name: Build Lumenora

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: lumenora-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Push Lumenora
        uses: ./.github/actions/blue-build-retry
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}

  build-nvidia:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Push Lumenora NVIDIA
        uses: ./.github/actions/blue-build-retry
        with:
          recipe: recipe-nvidia.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}

  build-nvidia-open:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Push Lumenora NVIDIA Open
        uses: ./.github/actions/blue-build-retry
        with:
          recipe: recipe-nvidia-open.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          registry_username: ${{ github.actor }}

  smoke:
    name: Smoke test ${{ matrix.variant }} image
    needs: [build, build-nvidia, build-nvidia-open]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            image: lumenora
            nvidia: false
          - variant: nvidia
            image: lumenora-nvidia
            nvidia: true
          - variant: nvidia-open
            image: lumenora-nvidia-open
            nvidia: true
    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image built from this commit
        env:
          IMAGE_NAME: ghcr.io/peter5235252/${{ matrix.image }}
        run: podman pull "${IMAGE_NAME}:${GITHUB_SHA::7}-44"

      - name: Check image payload
        env:
          IMAGE_NAME: ghcr.io/peter5235252/${{ matrix.image }}
          NVIDIA_VARIANT: ${{ matrix.nvidia }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}-44"
          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"
          podman image exists "$IMAGE"
          echo "=== Checking $IMAGE (nvidia=$NVIDIA_VARIANT) ==="
          podman run --rm --entrypoint /bin/bash "$IMAGE" -c '
            set -x
            echo "--- gpu-detect ---"
            test -x /usr/bin/lumenora-gpu-detect.sh || { echo "FAIL gpu-detect"; ls -l /usr/bin/lumenora*; exit 1; }
            echo "--- gpu-switch ---"
            test -x /usr/bin/lumenora-gpu-switch || { echo "FAIL gpu-switch"; ls -l /usr/bin/lumenora*; exit 1; }
            echo "--- gpu-common ---"
            test -f /usr/lib/lumenora/gpu-common.sh || { echo "FAIL gpu-common"; ls -l /usr/lib/lumenora/; exit 1; }
            echo "--- cosign.pub ---"
            test -f /etc/lumenora/cosign.pub || { echo "FAIL cosign.pub"; ls -l /etc/lumenora/; exit 1; }
            echo "--- cosign binary ---"
            command -v cosign >/dev/null || { echo "FAIL cosign binary"; ls -l /usr/bin/cosign* 2>&1 | head; echo PATH=$PATH; exit 1; }
            cosign version
            echo "--- service ---"
            test -f /usr/lib/systemd/system/lumenora-gpu-detect.service || { echo "FAIL service"; ls -l /usr/lib/systemd/system/lumenora*; exit 1; }
            echo "--- wallpaper ---"
            test -f /usr/share/wallpapers/Lumen/metadata.json || { echo "FAIL wallpaper"; ls -l /usr/share/wallpapers/Lumen/; exit 1; }
            echo "--- modules ---"
            test -d /usr/lib/modules || { echo "FAIL modules"; ls -l /usr/lib/; exit 1; }
            ls -l /usr/lib/modules
            if [ "${NVIDIA_VARIANT}" = "true" ]; then
              echo "Verifying NVIDIA EULA"
              test -f /usr/share/licenses/xorg-x11-drv-nvidia/LICENSE || { echo "FAIL LICENSE"; ls -l /usr/share/licenses/xorg-x11-drv-nvidia/ 2>&1 | head; exit 1; }
              grep -q "NVIDIA Driver License Agreement" /usr/share/licenses/xorg-x11-drv-nvidia/LICENSE || { echo "FAIL LICENSE content"; cat /usr/share/licenses/xorg-x11-drv-nvidia/LICENSE 2>&1 | head; exit 1; }
            fi
            echo "=== All checks passed ==="
          '
